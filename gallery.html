    <main id="main" class="section">
      <div class="container">
        <header class="page-head">
          <p class="eyebrow">Pressure in Frames</p>
          <h1>Gallery</h1>
          <p class="lead">
            No hype. Just moments that built it!
          </p>
        </header>

        <div class="gallery">
          <!-- Replace each .gallery-slot block with: <img src="images/gallery-01.jpg" alt="Describe the photo" /> (use 01–06 filenames to stay organised). -->
          <figure>
            <a href="images/liveset or studio.png">
              <img class="img-fluid" src="images/liveset or studio.png" alt="YoungPapi live set or studio session" width="1200" height="800" />
            </a>
            <figcaption>Studio Session</figcaption>
          </figure>
          <figure>
            <a href="images/portrait.png">
              <img class="img-fluid" src="images/portrait.png" alt="YoungPapi portrait" width="1200" height="800" />
            </a>
            <figcaption>Portrait</figcaption>
          </figure>
          <figure>
            <a href="images/street promo.png">
              <img class="img-fluid" src="images/street promo.png" alt="YoungPapi street promo visual" width="1200" height="800" />
            </a>
            <figcaption>Street promo</figcaption>
          </figure>
          <figure>
            <a href="images/crowd or energy.png">
              <img class="img-fluid" src="images/crowd or energy.png" alt="YoungPapi crowd energy moment" width="1200" height="800" />
            </a>
            <figcaption>Energy</figcaption>
          </figure>
          <figure>
            <a href="images/backstage.png">
              <img class="img-fluid" src="images/backstage.png" alt="YoungPapi backstage moment" width="1200" height="800" />
            </a>
            <figcaption>Backstage</figcaption>
          </figure>
          <figure>
            <a href="images/branding shot.png">
              <img class="img-fluid" src="images/branding shot.png" alt="YoungPapi branding shot" width="1200" height="800" />
            </a>
            <figcaption>Branding Shot</figcaption>
          </figure>
        </div>
      </div>

    <footer class="footer">
      <div class="container">© <span data-year></span> YoungPapi</div>
